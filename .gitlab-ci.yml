image: docker:latest

stages:
- build

build amd64:
  stage: build
  tags:
  - amd64
  only:
  - master
  before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
  - synversion=$(cat pyproject.toml | grep '^version =' | sed -E 's/^version = "(.+)"$/\1/')
  - docker build --tag $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:$synversion .
  - docker push $CI_REGISTRY_IMAGE:latest
  - docker push $CI_REGISTRY_IMAGE:$synversion
  - |
    if [[ "$synversion" =~ rc ]]; then
      echo "Not pushing :stable tag for $synversion"
    else
      echo "Pushing :stable tag for $synversion"
      docker tag $CI_REGISTRY_IMAGE:$synversion $CI_REGISTRY_IMAGE:stable
      docker push $CI_REGISTRY_IMAGE:stable
      docker rmi $CI_REGISTRY_IMAGE:stable
    fi
  - docker rmi $CI_REGISTRY_IMAGE:latest $CI_REGISTRY_IMAGE:$synversion
